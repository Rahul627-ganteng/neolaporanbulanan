# =====================================================================
#  CI/CD Portal Laporan Bulanan Sektor Guru KMI
#  push ke main  → build & uji → Edge Function + migrasi Supabase; Netlify membangun otomatis dari Git
#  pull request  → build & uji saja
#
#  Secrets (Settings → Secrets and variables → Actions):
#    SUPABASE_ACCESS_TOKEN   token akun Supabase (supabase.com/dashboard/account/tokens)
#    SUPABASE_PROJECT_REF    ref proyek, mis. abcdefghijklmnopqrst
#    CRON_SECRET             (opsional) pg_cron kini memakai secret Vault cron_secret
#    VITE_SUPABASE_URL       https://<ref>.supabase.co
#    VITE_SUPABASE_ANON_KEY  anon public key
#    VITE_PORTAL_URL         (opsional) alamat situs untuk pesan WhatsApp
#    NETLIFY_AUTH_TOKEN      personal access token Netlify
#    NETLIFY_SITE_ID         API ID situs Netlify
# =====================================================================
name: CI/CD Laporan Bulanan KMI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & uji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Uji modul bersama rundown & kalender (Node)
        run: |
          node --input-type=module -e "
          import * as R from './supabase/functions/_shared/rundown.js';
          const c = { hijri_month: 5, hijri_year: 1448, masehi_label: '2026', start_date: '2026-10-12', end_date: '2026-11-10', deadline_date: '2026-11-15' };
          if (R.computeWeek(c, '2026-11-03') !== 4) throw new Error('computeWeek salah');
          if (R.normalizeWa('0812-3456-7890') !== '6281234567890') throw new Error('normalizeWa salah');
          if (!R.deadlineText(c).startsWith('5 Jumadil Akhir 1448 H')) throw new Error('deadlineText salah');
          const H = await import('./supabase/functions/_shared/hijri.js');
          if (H.planCycleRollover({ active: c, today: '2026-11-14' }) !== null) throw new Error('rollover terlalu dini');
          const n = H.planCycleRollover({ active: c, today: '2026-11-16' });
          if (n.hijri_month !== 6 || n.hijri_year !== 1448 || n.start_date !== '2026-11-11') throw new Error('rollover salah: ' + JSON.stringify(n));
          console.log('rundown.js & hijri.js OK');"

      - name: Mode build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::warning::VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY belum diisi — situs dibangun dalam Mode Demo."
          fi

      - name: Build Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PORTAL_URL: ${{ secrets.VITE_PORTAL_URL }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  database:
    name: Migrasi Supabase & Edge Function
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PORTAL_URL: ${{ secrets.VITE_PORTAL_URL }}
    steps:
      - name: Periksa secret Supabase
        id: check
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Migrasi Supabase dilewati. Secret belum diisi:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      # Lewat Management API dengan access token: tidak butuh kata sandi database.
      # Migrasi dijalankan dulu karena Edge Function memakai RPC dari migrasi terbaru.
      - name: Jalankan migrasi database
        if: steps.check.outputs.ready == 'true'
        run: node scripts/apply-migrations.mjs

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy Edge Functions (weekly-reminder, admin-users)
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase functions deploy weekly-reminder --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy admin-users --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Setel secret Edge Function (opsional)
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -n "$CRON_SECRET" ]; then supabase secrets set --yes --project-ref "$SUPABASE_PROJECT_REF" CRON_SECRET="$CRON_SECRET"; fi
          if [ -n "$PORTAL_URL" ]; then supabase secrets set --yes --project-ref "$SUPABASE_PROJECT_REF" PORTAL_URL="$PORTAL_URL"; fi

  # Netlify sudah terhubung ke repo ini (Git integration) dan otomatis membangun
  # setiap push ke main. Job ini hanya untuk rilis manual (Actions → Run workflow).
  deploy:
    name: Deploy Netlify (manual)
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rilis produksi
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID kosong — lewati; Netlify Git-integration yang men-deploy."
            exit 0
          fi
          npx --yes netlify-cli@17 deploy --prod --dir=dist \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "main@${GITHUB_SHA::7} — ${COMMIT_MSG:-manual}"
